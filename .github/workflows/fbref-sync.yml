name: FBref -> Neon fixtures sync

on:
  schedule:
    - cron: "17 5,17 * * *"      # twice a day (05:17 and 17:17 UTC); GitHub may delay it a few minutes
  workflow_dispatch:              # "Run workflow" button in the Actions tab
    inputs:
      force:
        description: "Skip the shrink safety check (FORCE=1)"
        type: boolean
        default: false

concurrency: fbref-sync           # never two runs at once
permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium     # only used if FBref rejects the plain request
      - name: Scrape and load
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FORCE: ${{ inputs.force && '1' || '0' }}
        run: python sync.py
