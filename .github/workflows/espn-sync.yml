name: ESPN -> fixtures sync

on:
  schedule:
    - cron: "0 0,4,8,12,16,20 * * *"   # 6x a day, every 4 hours: 00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC (GitHub may start it a few minutes late)
  workflow_dispatch:
    inputs:
      mode:
        description: "upcoming = last/this/next week only (fast); full = whole season of every league"
        type: choice
        options: [upcoming, full]
        default: upcoming
      season:
        description: "Backfill: season(s) to load, e.g. 2025 or 2024,2025,2025-2026 (leave empty for the current season). Use with mode=full"
        default: ""
      force:
        description: "Skip the shrink safety check (FORCE=1)"
        type: boolean
        default: false

concurrency: espn-sync
permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45     # first run fetches goals/cards for every finished match; later runs are quick
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "psycopg[binary]>=3.2"
      - name: Fetch and load
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FORCE: ${{ inputs.force && '1' || '0' }}
          MODE: ${{ inputs.mode || 'upcoming' }}      # scheduled runs have no inputs -> upcoming
          SEASON: ${{ inputs.season || '' }}
        run: |
          if [ "$MODE" = "full" ]; then
            if [ -n "$SEASON" ]; then python sync_espn.py --season "$SEASON"; else python sync_espn.py; fi
          else python sync_espn.py --upcoming; fi
