name: ESPN -> fixtures sync

on:
  schedule:
    - cron: "17 5,17 * * *"      # twice a day (05:17 and 17:17 UTC)
  workflow_dispatch:
    inputs:
      force:
        description: "Skip the shrink safety check (FORCE=1)"
        type: boolean
        default: false

concurrency: espn-sync
permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "psycopg[binary]>=3.2"
      - name: Fetch and load
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FORCE: ${{ inputs.force && '1' || '0' }}
        run: python sync_espn.py
